<style>

.form{display:flex;flex-direction:column;gap:12px}

#push{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);width:calc(100% - 24px);max-width:440px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--lamp);border-radius:8px 18px 18px 8px;padding:16px 18px;box-shadow:0 14px 40px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2);z-index:20;transition:transform .4s cubic-bezier(.2,.9,.3,1.2);display:flex;gap:14px;align-items:center;cursor:pointer}

<script>
window.fbReady=new Promise(r=>{window._fbRes=r;setTimeout(()=>r(null),8000)});
</script>
<script type="module" src="fb.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MON=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const now=new Date();
const cap=s=>s[0].toUpperCase()+s.slice(1);
$('#today').textContent=cap(DAYS[now.getDay()])+' '+now.getDate()+'. '+MON[now.getMonth()];

/* Innhold hentes fra Firebase (Firestore). Hvis databasen er tom eller utilgjengelig, brukes
   JSON-filene i data/ som reserve. Innlogging og adminskjema bruker Firebase Authentication. */
let FB=null,usingFb=false;
let events=[],posts=[],regular=[],rawEvents=[],members=[],counts={};
const todayStart=new Date(now);todayStart.setHours(0,0,0,0);
let seen=0;try{seen=+localStorage.getItem('sm-seen')||0}catch(e){}
const markSeen=()=>{seen=Date.now();try{localStorage.setItem('sm-seen',String(seen))}catch(e){}posts.forEach(p=>p.read=true);state.unread=0};
const isNew=p=>p.ms?p.ms>seen:!!(p.unread&&!p.read);
const getJson=f=>fetch('data/'+f+'.json').then(r=>r.json());
async function fetchAll(){
  if(FB){
    try{
      const [e,p,g]=await Promise.all([FB.list('events'),FB.list('posts'),FB.list('regular')]);
      if(e.length||p.length||g.length){usingFb=true;return [e,p,g]}
    }catch(err){console.warn('Firestore:',err)}
  }
  usingFb=false;
  return Promise.all([getJson('events'),getJson('posts'),getJson('regular').catch(()=>[])]);
}
async function load(){
  const [e,p,g]=await fetchAll();
  rawEvents=e;
  events=e.filter(x=>canSee(x)&&canSeeCat(x.cat)).map(x=>({...x,t:esc(x.title),d:esc(x.text),w:new Date(x.start+'T'+(x.time||'00:00')),e:x.end?new Date(x.end+'T23:59'):null}))
    .filter(x=>(x.e||x.w)>=todayStart).sort((a,b)=>a.w-b.w);
  posts=p.filter(canSee).sort((a,b)=>(b.ms||0)-(a.ms||0));
  regular=g.filter(r=>canSeeCat(r.cat)&&visOK(r)).sort((a,b)=>((a.day+6)%7-(b.day+6)%7)||String(a.time).localeCompare(String(b.time)));
  counts=usingFb&&FB?await FB.counts().catch(()=>({})):{};
  members=state.admin&&FB?await FB.listUsers().catch(()=>[]):[];
  state.unread=posts.filter(isNew).length;
}
function ago(p){
  if(!p.ms)return p.ago||'';
  const d=Math.round((todayStart-new Date(p.ms).setHours(0,0,0,0))/864e5);
  if(d<=0)return 'i dag';if(d===1)return 'i går';if(d<14)return 'for '+d+' dager siden';
  const x=new Date(p.ms);return x.getDate()+'. '+MON[x.getMonth()]}
const cnt=id=>counts[id]>0?`<div class="small">${counts[id]} kommer</div>`:'';
const tm=e=>e.time?' kl. '+e.time:'';
const state={tab:'home',filter:'Alle',member:false,admin:false,user:null,rsvp:{},rem:{},open:{},
  prefs:{Møter:true,Happeninger:true,Ungdom:false,Viktig:true},unread:0,sv:'',svE:'',pwMsg:'',leder:false,memELd:'',memEA:'',memEL:'',memEM:'',memGL:[],memGM:[],snaps:null,snapMsg:'',view:'meg',real:null,vl:['activ8'],af:'Alle',acc:{},sel:{},groups:[],leads:[],ulOpen:'',psMal:'alle',psGr:[],ugOpen:'',backupMsg:'',pushMsg:'',pushSendMsg:'',psT:'',psB:'',psTab:'news',psNews:true,psHide:false,pushOk:false,memMsg:'',memE:'',memR:'member',adm:{type:'events',edit:null},msg:'',err:''};
try{Object.assign(state,JSON.parse(localStorage.getItem('sm-proto')||'{}'))}catch(e){}
state.member=false;state.admin=false;state.user=null;
{const dt=new URLSearchParams(location.search).get('tab');if(['home','prog','news','me'].includes(dt)){state.tab=dt;try{history.replaceState(null,'',location.pathname)}catch(e){}}}
const save=()=>{try{localStorage.setItem('sm-proto',JSON.stringify({rsvp:state.rsvp,rem:state.rem,prefs:state.prefs}))}catch(e){}};

const ICON={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 news:'<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2M8 9h6M8 13h6"/>',
 me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const TABS=[['home','Hjem','home'],['prog','Program','cal'],['news','Nyheter','news'],['me','Meg','me']];
function drawTabs(){$('#tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-t="${k}" ${state.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ICON[i]}</svg>${l}</button>`).join('')}

function when(d){const diff=Math.round((new Date(d).setHours(0,0,0,0)-new Date(now).setHours(0,0,0,0))/864e5);
  return diff===0?'I dag':diff===1?'I morgen':cap(DAYS[d.getDay()])}
function dateBox(ev){const d=ev.w,e=ev.e;const m=cap(MON[d.getMonth()]);const s=e&&e.getTime()!==new Date(d).setHours(23,59,0,0)?`${d.getDate()}.${e.getMonth()===d.getMonth()?'-'+e.getDate()+'. '+m:' '+m+'-'+e.getDate()+'. '+cap(MON[e.getMonth()])}`:`${d.getDate()}. ${m}`;const yr=d.getFullYear()!==now.getFullYear()?`<br><span style="font-size:13px;opacity:.8">${d.getFullYear()}</span>`:'';return `<div class="date">${s.replace('.-','.–')}${yr}</div>`}
const dkey=w=>w.getFullYear()+'-'+String(w.getMonth()+1).padStart(2,'0')+'-'+String(w.getDate()).padStart(2,'0');
const hhmm=w=>String(w.getHours()).padStart(2,'0')+':'+String(w.getMinutes()).padStart(2,'0');
const TIDOK=t=>/^[0-9]{1,2}:[0-9]{2}$/.test(t||'');
/* Neste forekomst av hver fast samling. Unntak (r.ex[dato]): fjernet = hoppes over, avlyst = vises som avlyst (og neste gang vises også), endret = nytt klokkeslett og/eller merknad. */
function nextFast(){const out=[];
  regular.filter(r=>TIDOK(r.time)).forEach(r=>{const [h,mi]=r.time.split(':').map(Number);let w=new Date(now);w.setHours(h,mi,0,0);w.setDate(w.getDate()+(r.day-w.getDay()+7)%7);if(w<now)w.setDate(w.getDate()+7);
    for(let i=0;i<10;i++){const k=dkey(w),ex=(r.ex||{})[k];
      if(!ex||ex.k!=='fjernet'){const ww=new Date(w);if(ex&&ex.k==='endret'&&TIDOK(ex.time)){const [h2,m2]=ex.time.split(':').map(Number);ww.setHours(h2,m2,0,0)}
        out.push({fast:r,w:ww,ex});if(!ex||ex.k!=='avlyst')break}
      w=new Date(w);w.setDate(w.getDate()+7)}});
  return out}

});

function wizAsk(){

function wizStart(dlg,t){
  state.adm={type:t,edit:null,form:false};state.msg='';
  const steps=WIZ[t],n=steps.length;let cur=0;
  dlg.innerHTML='<div class="small" id="wizN" style="margin:0 0 6px"></div><div style="height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px"><div id="wizBar" style="height:100%;background:var(--lamp);width:0;transition:width .25s"></div></div>'
   +'<form class="form" id="adm" data-type="'+t+'" novalidate>'
   +steps.map((st,i)=>'<div class="wizs" data-i="'+i+'" style="display:none;gap:12px"><div><h3 style="margin:0">'+esc(st.h)+'</h3>'+(st.p?'<p class="small" style="margin:4px 0 0">'+esc(st.p)+'</p>':'')+'</div>'+(st.sum?'<div id="wizSum" class="card" style="background:var(--bg);display:grid;gap:4px;font-size:15px"></div>':'')+fields(t,null,st.keys)+'</div>').join('')
   +'<div class="btns" style="margin-top:6px"><button class="btn" type="button" id="wizBack">Tilbake</button><button class="btn primary" type="button" id="wizNext" style="width:auto">Neste</button><button class="btn primary" type="submit" id="wizGo" style="width:auto" disabled>Opprett</button><button class="btn" type="button" data-pubclose>Avbryt</button></div></form><p class="small" role="status" id="pubMsg" style="margin:8px 0 0"></p>';
  const f=dlg.querySelector('#adm'),stepEl=i=>f.querySelector('.wizs[data-i="'+i+'"]');
  const kat=k=>{const e=f.elements[k];return e?(e.value||''):''};
  const summary=()=>{
    const fd=new FormData(f),g=k=>String(fd.get(k)||'').trim(),L=[];
    const rad=(a,b)=>b?'<div><span class="small">'+esc(a)+':</span> <b>'+esc(b)+'</b></div>':'';
    if(t==='events'){
      const gr=fd.getAll('groups'),hvem=gr.length?gr.map(gName).join(', '):(fd.has('m')?'Bare medlemmer':'Alle');
      const tid=g('timeSel')==='__annet'?g('time'):g('timeSel'),sted=g('placeSel')==='__annet'?g('place'):g('placeSel');
      L.push(rad('Tittel',g('title')),rad('Kategori',g('cat')),rad('Hvem',hvem),rad('Når',g('start')+(g('end')?' – '+g('end'):'')+(tid?' kl. '+tid:'')),rad('Sted',sted),rad('Taler/hvem',g('who')),rad('Beskrivelse',g('text')))}
    else{const tid=g('timeSel')==='__annet'?g('time'):g('timeSel');L.push(rad('Tittel',g('title')),rad('Kategori',g('cat')),rad('Når','Hver '+DAYS[+g('day')]+(tid?' kl. '+tid:'')),rad('Merknad',g('note')))}
    $('#wizSum').innerHTML=L.join('')};
  const show=i=>{cur=i;f.querySelectorAll('.wizs').forEach(e=>e.style.display=(+e.dataset.i===i)?'grid':'none');
    $('#wizN').textContent='Steg '+(i+1)+' av '+n;$('#wizBar').style.width=((i+1)/n*100)+'%';
    $('#wizBack').style.display=i?'':'none';$('#wizNext').style.display=i<n-1?'':'none';$('#wizGo').style.display=i===n-1?'':'none';$('#wizGo').disabled=i!==n-1;
    if(steps[i].sum)summary();state.msg='';$('#pubMsg').textContent=''};
  const feil=m=>{state.msg=m;$('#pubMsg').textContent=m};
  const ok=()=>{
    const els=[...stepEl(cur).querySelectorAll('input,select,textarea')];
    for(const el of els){if(el.hidden||!el.willValidate)continue;if(!el.checkValidity()){el.reportValidity();return false}}
    if(t==='events'&&cur===1&&!state.admin&&!f.querySelector('[name=groups]:checked')){feil('Velg minst én av gruppene du leder.');return false}
    if(t==='regular'&&cur===1){const tid=f.elements.timeSel&&f.elements.timeSel.value==='__annet'?f.elements.time.value:(f.elements.timeSel?f.elements.timeSel.value:'');if(!tid){feil('Velg eller skriv inn klokkeslett.');return false}}
    return true};
  $('#wizNext').addEventListener('click',()=>{if(ok())show(cur+1)});
  $('#wizBack').addEventListener('click',()=>show(cur-1));
  f.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();if(cur<n-1&&ok())show(cur+1)}});
  show(0);
}
function pubAsk(){

function fastAsk(id,dato){
  const r=regular.find(x=>x.id===id);if(!r||!FB)return;
  const ex=(r.ex||{})[dato]||null,d=new Date(dato+'T'+r.time),dn=cap(DAYS[d.getDay()])+' '+d.getDate()+'. '+MON[d.getMonth()],dlg=document.createElement('dialog');dlg.className='lp';
  const stat=ex?(ex.k==='avlyst'?'Avlyst denne gangen.':ex.k==='endret'?'Endret denne gangen'+(ex.time?': kl. '+ex.time:'')+(ex.note?' · '+ex.note:'')+'.':''):'';
  dlg.innerHTML='<form class="form" method="dialog" onkeydown="if(event.key===\'Enter\'&&event.target.tagName===\'INPUT\')event.preventDefault()"><h3 style="margin:0">'+esc(r.title)+'</h3><p class="small" style="margin:0">'+esc(dn)+' kl. '+esc(r.time)+(stat?'<br><b>'+esc(stat)+'</b>':'')+'</p>'
   +(PUSH_URL?'<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="lpPush" style="width:22px;height:22px;flex:none">Send varsel til alle (gjelder avlys og endre)</label><div id="lpMsg" style="display:none;gap:8px"><label class="f">Varseltittel<input id="lpPT" maxlength="60"></label><label class="f">Varseltekst<textarea id="lpPB" rows="3" maxlength="140"></textarea></label><span class="small">Standardteksten settes inn automatisk. Skriv over den hvis du vil si noe annet.</span></div>':'')
   +'<div class="btns col">'+(ex&&ex.k!=='fjernet'?'<button class="btn" value="angre">Angre ('+(ex.k==='avlyst'?'avlysning':'endring')+')</button>':'')+(ex&&ex.k==='avlyst'?'':'<button class="btn" value="avlys">Merk denne gangen som avlyst</button>')+'<button class="btn" value="fjern">Fjern bare denne gangen</button></div>'
   +'<details><summary style="cursor:pointer;font-weight:600">Endre denne gangen</summary><div style="display:grid;gap:8px;margin-top:8px"><label class="f">Nytt klokkeslett<input id="lpTime" type="time"></label><label class="f">Ny merknad<input id="lpNote" type="text" maxlength="100"></label><button class="btn" value="endre">Lagre endringen</button></div></details>'
   +'<div class="btns col"><button class="btn" value="rediger">Endre hele den faste samlingen</button><button class="btn danger" value="slettalle">Slett hele den faste samlingen</button><button class="btn" value="avbryt">Avbryt</button></div></form>';
  document.body.appendChild(dlg);
  const defs=(rv,tid,nt)=>rv==='endre'?['Endret: '+r.title,dn+(TIDOK(tid)?', nå kl. '+tid:'')+(nt?'. '+nt:'')]:['Avlyst: '+r.title,dn+' kl. '+r.time+' er avlyst.'];
  const pt=dlg.querySelector('#lpPT'),pb=dlg.querySelector('#lpPB'),pc=dlg.querySelector('#lpPush');let dirty=false;
  if(pc){const d0=defs('avlys');pt.value=d0[0];pb.value=d0[1];pc.addEventListener('change',()=>{dlg.querySelector('#lpMsg').style.display=pc.checked?'grid':'none'});[pt,pb].forEach(i=>i.addEventListener('input',()=>{dirty=true}))}
  dlg.addEventListener('close',async()=>{
    const rv=dlg.returnValue,send=!!(dlg.querySelector('#lpPush')&&dlg.querySelector('#lpPush').checked),time=dlg.querySelector('#lpTime').value.trim(),note=dlg.querySelector('#lpNote').value.trim();dlg.remove();
    try{
      if(rv==='rediger'){state.adm={type:'regular',edit:id,form:true};state.tab='me';state.acc.adm=true;state.msg='';render();setTimeout(()=>{const f=$('#adm');if(f)f.scrollIntoView({block:'start'})},80);return}
      if(rv==='slettalle'){
        if(!confirm('Slette hele den faste samlingen «'+r.title+'»? Alle kommende ganger forsvinner.'))return;
        try{await FB.ensureSnapshot('Før sletting',5*60e3)}catch(er){if(!confirm('Kunne ikke lage et sikkerhetspunkt før sletting ('+((er&&er.code)||'feil')+'). Slette likevel?'))return}
        await FB.del('regular',id);await refresh();push('Slettet','«'+r.title+'» er fjernet.');return}
      const nx={...(r.ex||{})};
      if(rv==='avlys')nx[dato]={k:'avlyst'};
      else if(rv==='angre')delete nx[dato];
      else if(rv==='fjern')nx[dato]={k:'fjernet'};
      else if(rv==='endre'){if(!TIDOK(time)&&!note){push('Fyll ut','Skriv nytt klokkeslett eller en merknad.');return}nx[dato]={k:'endret',...(TIDOK(time)?{time}:{}),...(note?{note}:{})}}
      else return;
      await FB.setFastEx(id,nx);
      let tillegg='';
      if(send&&PUSH_URL&&(rv==='avlys'||rv==='endre')){
        const df=defs(rv,time,note),tittel=dirty&&pt.value.trim()?pt.value.trim():df[0],body=dirty&&pb.value.trim()?pb.value.trim():df[1];
        try{const res=await FB.sendPush(PUSH_URL,tittel,body,'prog',{type:'alle'});tillegg=res.ok?' Varsel sendt til '+res.sendt+' enheter.':' Varsel ikke sendt: '+res.feil}catch(x){tillegg=' Varsel kunne ikke sendes.'}}
      await refresh();
      push(rv==='avlys'?'Merket som avlyst':rv==='fjern'?'Fjernet denne gangen':rv==='endre'?'Endret':'Angret',(dn+'.')+tillegg)
    }catch(er){push('Kunne ikke lagre',saveMsg(er&&er.code))}});
  dlg.showModal();
}

}

  if(FB){FB.pushSupported().then(v=>{state.pushOk=v;if(state.tab==='me')keep(()=>{})});FB.onPush(p=>push((p.notification&&p.notification.title)||'Melding',(p.notification&&p.notification.body)||''))}
