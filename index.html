<style>
/* Layout: mobilapp i smal kolonne, fast fanelinje nederst, innhold bytter per fane */
:root{
  --bg:#c9e1fb; --surface:#ffffff; --ink:#0f3a5f; --muted:#4a6d8c; --line:#b3d1f0;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --brand:#7fb8ee; --brand-ink:#08243f; --lamp:#f0a553; --lamp-soft:#3a2a14;

:root[data-theme="dark"]{

  --brand:#7fb8ee; --brand-ink:#08243f; --lamp:#f0a553; --lamp-soft:#3a2a14;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
button{font:inherit;color:inherit;cursor:pointer}

.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{display:flex;align-items:center;gap:10px;min-width:0}

:root[data-theme="dark"] .logo-mark img{filter:invert(1)}
.logo b{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:24px;letter-spacing:.02em;display:block;line-height:1}

dialog{background:var(--surface);color:var(--ink);border:0;border-radius:16px;padding:18px;width:min(92vw,400px);box-shadow:0 10px 30px rgba(0,0,0,.3)}

details.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";width:10px;height:10px;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .15s;flex:none}

.next{background:var(--brand);color:var(--brand-ink);border-color:transparent}

.alert b{display:block}
.row{display:flex;gap:12px;align-items:center;min-width:0}

.item>button:focus-visible{outline:3px solid var(--lamp);outline-offset:-3px}
.detail{padding:0 14px 14px 116px;display:none;flex-direction:column;gap:10px}
.item.open .detail{display:flex}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);padding:12px 18px;font-size:16px;border-radius:12px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}

.reg{display:flex;flex-direction:column;gap:2px}
.reg .r{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.reg .r:last-child{border:0}
.reg .d{flex:none;width:86px;font-weight:600}
.reg .d span{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.day{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:6px 0 -2px}
.post{display:flex;flex-direction:column;gap:6px}
.post .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lamp);flex:none}
.locked{display:flex;gap:12px;align-items:center;color:var(--muted)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.tg{flex:none;width:48px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-checked="true"]{background:var(--brand)}
.tg[aria-checked="true"]::after{transform:translateX(20px)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.form{display:flex;flex-direction:column;gap:12px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#push{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);width:calc(100% - 24px);max-width:416px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;transition:transform .35s;display:flex;gap:10px;align-items:flex-start}
#push.show{transform:translate(-50%,0)}
#push .logo-mark{width:26px;height:32px}
#push b{display:block;font-size:14px}
#push span{font-size:14px;color:var(--muted)}
.theme{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;align-self:center}
@media (prefers-reduced-motion:reduce){#push,.tg,.tg::after{transition:none}}
</style></head><body>

<div class="app">
  <header class="top">
    <div class="logo"><div class="logo-mark"><img src="logo-512.png" alt="Sion Molde"></div><div><b>Sion Molde</b><span id="today"></span></div></div>
    <div class="hr"><button class="bell" id="themeBtn" type="button"></button><button class="bell" id="bellBtn" aria-label="Varsler"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><i id="badge">0</i></button></div>

<dialog id="rsDlg" aria-labelledby="rsT"><form class="form" id="rs" method="dialog">

<script>
window.fbReady=new Promise(r=>{window._fbRes=r;setTimeout(()=>r(null),8000)});
</script>
<script type="module" src="fb.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MON=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const now=new Date();
const cap=s=>s[0].toUpperCase()+s.slice(1);
$('#today').textContent=cap(DAYS[now.getDay()])+' '+now.getDate()+'. '+MON[now.getMonth()];

/* Innhold hentes fra Firebase (Firestore). Hvis databasen er tom eller utilgjengelig, brukes
   JSON-filene i data/ som reserve. Innlogging og adminskjema bruker Firebase Authentication. */
let FB=null,usingFb=false;
let events=[],posts=[],regular=[],rawEvents=[],members=[],counts={};
const todayStart=new Date(now);todayStart.setHours(0,0,0,0);
let seen=0;try{seen=+localStorage.getItem('sm-seen')||0}catch(e){}
const markSeen=()=>{seen=Date.now();try{localStorage.setItem('sm-seen',String(seen))}catch(e){}posts.forEach(p=>p.read=true);state.unread=0};
const isNew=p=>p.ms?p.ms>seen:!!(p.unread&&!p.read);
const getJson=f=>fetch('data/'+f+'.json').then(r=>r.json());
async function fetchAll(){
  if(FB){
    try{
      const [e,p,g]=await Promise.all([FB.list('events'),FB.list('posts'),FB.list('regular')]);
      if(e.length||p.length||g.length){usingFb=true;return [e,p,g]}
    }catch(err){console.warn('Firestore:',err)}
  }
  usingFb=false;
  return Promise.all([getJson('events'),getJson('posts'),getJson('regular').catch(()=>[])]);
}
async function load(){
  const [e,p,g]=await fetchAll();
  rawEvents=e;
  events=e.filter(canSee).map(x=>({...x,t:esc(x.title),d:esc(x.text),w:new Date(x.start+'T'+(x.time||'00:00')),e:x.end?new Date(x.end+'T23:59'):null}))
    .filter(x=>(x.e||x.w)>=todayStart).sort((a,b)=>a.w-b.w);
  posts=p.filter(canSee).sort((a,b)=>(b.ms||0)-(a.ms||0));
  regular=g.slice().sort((a,b)=>((a.day+6)%7-(b.day+6)%7)||String(a.time).localeCompare(String(b.time)));
  counts=usingFb&&FB?await FB.counts().catch(()=>({})):{};
  members=state.admin&&FB?await FB.listUsers().catch(()=>[]):[];
  state.unread=posts.filter(isNew).length;
}
function ago(p){
  if(!p.ms)return p.ago||'';
  const d=Math.round((todayStart-new Date(p.ms).setHours(0,0,0,0))/864e5);
  if(d<=0)return 'i dag';if(d===1)return 'i går';if(d<14)return 'for '+d+' dager siden';
  const x=new Date(p.ms);return x.getDate()+'. '+MON[x.getMonth()]}
const cnt=id=>counts[id]>0?`<div class="small">${counts[id]} kommer</div>`:'';
const tm=e=>e.time?' kl. '+e.time:'';
const state={tab:'home',filter:'Alle',member:false,admin:false,user:null,rsvp:{},rem:{},open:{},
  prefs:{Møter:true,Happeninger:true,Ungdom:false,Viktig:true},unread:0,sv:'',svE:'',pwMsg:'',acc:{},sel:{},groups:[],leads:[],ulOpen:'',psMal:'alle',psGr:[],ugOpen:'',backupMsg:'',pushMsg:'',pushSendMsg:'',psT:'',psB:'',psTab:'news',psNews:true,psHide:false,pushOk:false,memMsg:'',memE:'',memR:'member',adm:{type:'events',edit:null},msg:'',err:''};
try{Object.assign(state,JSON.parse(localStorage.getItem('sm-proto')||'{}'))}catch(e){}
state.member=false;state.admin=false;state.user=null;
{const dt=new URLSearchParams(location.search).get('tab');if(['home','prog','news','me'].includes(dt)){state.tab=dt;try{history.replaceState(null,'',location.pathname)}catch(e){}}}
const save=()=>{try{localStorage.setItem('sm-proto',JSON.stringify({rsvp:state.rsvp,rem:state.rem,prefs:state.prefs}))}catch(e){}};

const ICON={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 news:'<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2M8 9h6M8 13h6"/>',
 me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const TABS=[['home','Hjem','home'],['prog','Program','cal'],['news','Nyheter','news'],['me','Meg','me']];
function drawTabs(){$('#tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-t="${k}" ${state.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24">${ICON[i]}</svg>${l}</button>`).join('')}

function when(d){const diff=Math.round((new Date(d).setHours(0,0,0,0)-new Date(now).setHours(0,0,0,0))/864e5);
  return diff===0?'I dag':diff===1?'I morgen':cap(DAYS[d.getDay()])}
function dateBox(ev){const d=ev.w,e=ev.e;const m=cap(MON[d.getMonth()]);const s=e&&e.getTime()!==new Date(d).setHours(23,59,0,0)?`${d.getDate()}.${e.getMonth()===d.getMonth()?'-'+e.getDate()+'. '+m:' '+m+'-'+e.getDate()+'. '+cap(MON[e.getMonth()])}`:`${d.getDate()}. ${m}`;const yr=d.getFullYear()!==now.getFullYear()?`<br><span style="font-size:13px;opacity:.8">${d.getFullYear()}</span>`:'';return `<div class="date">${s.replace('.-','.–')}${yr}</div>`}
function evItem(e){
  if(e.m&&!state.member)return `<div class="item"><div class="locked" style="padding:12px">${dateBox(e)}<div class="grow"><b>${e.t}</b><span class="small">Kun for medlemmer. Logg inn under «Meg».</span></div></div></div>`;
  const open=state.open[e.id],r=state.rsvp[e.id];
  return `<div class="item ${open?'open':''}"><button data-ev="${e.id}" aria-expanded="${!!open}">${dateBox(e)}
   <div class="grow"><b>${e.t}</b><span class="small">${when(e.w)} ${tm(e)}${e.place?' · '+esc(e.place):''}${e.groups&&e.groups.length?' · '+esc(e.groups.map(gName).join(', ')):''}</span></div>
   ${e.m?'<span class="tag m">Medlem</span>':`<span class="tag">${esc(normCat(e.cat))}</span>`}</button>
   <div class="detail"><div>${e.d}</div><div class="small">${esc(e.who)}</div>
   <div class="btns"><button class="btn ${r?'on':''}" data-rsvp="${e.id}">${r?'✓ Jeg kommer':'Jeg kommer'}</button>
   </div>${cnt(e.id)}</div></div>`}

/* Påmeldingen går til Google Skjema «Sommerstevne påmeldinger nyhetsbrev». Svarene havner i et regneark i Drive,
   og scriptet i regnearket sender e-postvarsel. Google svarer ikke tilbake til nettsider, så vi kan ikke se om det lyktes. */
const SV_URL='https://docs.google.com/forms/d/e/1FAIpQLScYERloVM4jsoPdXmpeqJYecXNBGl6GNNjNl5vequqCrTvSWw/formResponse',SV_ENTRY='entry.1990573754';
/* «Jeg kommer»: navn og svar sendes til Google Skjema «Jeg kommer – arrangementer» (regneark i Drive).
   Tallet som vises i appen telles separat i databasen. Google svarer ikke tilbake, så vi ser ikke om det lyktes. */
/* Adressen til Apps Script-tjenesten som sender varsler (varsel-script.gs). Tom = skjemaene for å sende varsel skjules. */
let PUSH_URL='https://script.google.com/macros/s/AKfycbz-t4PruOcRFJQ_bXwEcpdab9ks6_AMl2wlJZSO7UztI05fUK7UcnPEvV9gsEvwcbV5/exec';
const RS_URL='https://docs.google.com/forms/d/e/1FAIpQLScVKs0aIg8RU7Ess9mFMnKUOHudetvn5AtQIqiIn-OA94rXcg/formResponse';
const RS={arr:'entry.568243152',dato:'entry.1403655940',navn:'entry.1951632759',kontakt:'entry.722221792',svar:'entry.903786018'};
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let rsPending=null;
function openRsvp(id){
  const ev=events.find(x=>x.id==id);if(!ev)return;
  rsPending=id;$('#rsT').textContent='Jeg kommer: '+ev.title;
  $('#rsN').value=lsGet('sm-navn');$('#rsK').value=lsGet('sm-kontakt')||(state.user?state.user.email:'');
  $('#rsDlg').showModal();$('#rsN').focus();
}
async function setRsvp(id,on,navn,kontakt){
  const ev=events.find(x=>x.id==id)||{};
  keep(()=>{state.rsvp[id]=on;save();if(usingFb)counts[id]=Math.max(0,(counts[id]||0)+(on?1:-1))});
  const nm=navn||lsGet('sm-navn');
  if(nm)fetch(RS_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({[RS.arr]:ev.title||'',[RS.dato]:(ev.start||'')+(ev.end?' – '+ev.end:''),[RS.navn]:nm,[RS.kontakt]:kontakt||lsGet('sm-kontakt'),[RS.svar]:on?'Kommer':'Kommer ikke'})}).catch(()=>{});
  if(usingFb&&FB)try{await FB.rsvp(id,on?1:-1)}catch(er){keep(()=>{state.rsvp[id]=!on;save();counts[id]=Math.max(0,(counts[id]||0)+(on?-1:1))});push('Kunne ikke lagre svaret','Prøv igjen om litt.')}
}

function svCard(){
  return `<div class="card"><h2>Sommerstevne</h2><p class="small" style="margin:6px 0 12px">Neste sommerstevne er <b>22.–27. juni 2027</b>. Legg igjen e-posten din for å få mer info.</p>
  <form class="form" id="sv"><label class="f">E-post<input id="svE" type="email" autocomplete="email" required value="${esc(state.svE)}"></label><button class="btn primary" type="submit">Meld meg på</button></form>
  <p class="small" role="status" style="margin:8px 0 0">${esc(state.sv)}</p><p class="small" style="margin:6px 0 0">E-posten brukes bare til informasjon om sommerstevnet.</p></div>`}

function home(){
  const vis=events.filter(e=>(!e.m||state.member)&&!e.hideHome), n=vis[0], wk=vis.slice(1,4);
  const post=posts.filter(p=>(!p.m||state.member)&&!p.hideHome)[0];
  return `<div><h1>Velkommen</h1><span class="script">dette skjer i Sion Molde</span></div>
  ${n?`<div class="card next"><div class="eyebrow">Neste samling</div><h2>${n.t}</h2>
   <div class="meta">${when(n.w)}${tm(n)}${n.place?' · '+esc(n.place):''}</div>
   <div class="btns" style="margin-top:12px"><button class="btn" style="color:var(--ink)" data-rsvp="${n.id}" data-stay="1">${state.rsvp[n.id]?'✓ Jeg kommer':'Jeg kommer'}</button></div>${counts[n.id]>0?`<div class="meta" style="margin-top:8px">${counts[n.id]} kommer</div>`:''}</div>`
  :`<div class="card next"><div class="eyebrow">Neste samling</div><h2>Ingen planlagt</h2><div class="meta">Se faste samlinger under Program.</div></div>`}
  ${post?`<div class="alert"><b>${esc(post.t)}</b><span class="small">${esc(post.b)}</span></div>`:''}
  ${wk.length?`<div><h2 style="margin-bottom:10px">Kommer snart</h2><div class="list">${wk.map(evItem).join('')}</div></div>`:''}
  ${svCard()}
  <div class="card"><h2>Finn frem</h2><p class="small" style="margin:6px 0 0">Adresse: Kometvegen 7, 6419 Molde<br>Kontortid: tirsdag–torsdag kl. 10–16<br>Telefon: <a href="tel:+4771251029">71 25 10 29</a><br>E-post: <a href="mailto:post@sionmolde.no">post@sionmolde.no</a></p></div>`}

function prog(){
  const cats=['Alle',...CATS];
  const list=events.filter(e=>state.filter==='Alle'||normCat(e.cat)===state.filter);
  let last='',out='';
  list.forEach(e=>{const k=when(e.w)+' '+e.w.getDate()+'. '+MON[e.w.getMonth()]+(e.w.getFullYear()!==now.getFullYear()?' '+e.w.getFullYear():'');
    if(k!==last){out+=`<div class="day">${k}</div>`;last=k}out+=evItem(e)});
  return `<div class="hd"><h1>Kommende arrangementer</h1><span class="script">sett av datoene!</span></div><div class="chips">${cats.map(c=>`<button class="chip" data-f="${c}" aria-pressed="${state.filter===c}">${c}</button>`).join('')}</div>
  <div class="list">${out||'<p class="small">Ingen oppføringer her ennå.</p>'}</div>${regList()}`}

function regList(){
  const l=regular.filter(r=>state.filter==='Alle'||normCat(r.cat)===state.filter);
  if(!l.length)return '';
  return `<div><h2 style="margin-bottom:10px">Faste samlinger</h2><div class="card reg">${l.map(r=>`<div class="r"><div class="d">${cap(DAYS[r.day])}<span>kl. ${esc(r.time)}</span></div><div class="grow"><b>${esc(r.title)}</b>${r.note?`<span class="small">${esc(r.note)}</span>`:''}</div></div>`).join('')}</div></div>`}

function news(){
  const l=posts.map(p=>{
   if(p.m&&!state.member)return `<div class="card locked"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div><b style="color:var(--ink)">${esc(p.t)}</b><div class="small">Logg inn som medlem for å lese.</div></div></div>`;
   return `<div class="card post"><div class="head">${isNew(p)?'<span class="dot" title="Ulest"></span>':''}${postTags(p)}<span class="small">${esc(ago(p))}</span></div><h3>${esc(p.t)}</h3><div class="small" style="color:var(--ink)">${esc(p.b)}</div></div>`}).join('');
  return `<h1>Nyheter</h1><div class="list">${l||'<p class="small">Ingen nyheter ennå.</p>'}</div>`}

/* ---------- Innlogging og administrasjon ---------- */
const CATS=['Møte','Samling','Ledersamling','Menighetsmøte','Happeninger','Ungdom'];
const normCat=c=>c==='Møter'?'Møte':c;   // eldre arrangementer og faste samlinger bruker «Møter»
/* Grupper i menigheten: [id, navn, forklaring]. Samme id-er står i varsel-script.gs. Brukere plasseres i grupper under Brukere. */
const GROUPS=[['sondagsskole','Søndagsskole','barnearbeid'],['activ8','Activ8','ungdom'],['hangout','Hangout','unge voksne'],['debora','Debora','kvinnearbeid'],['cdur','Sion C-dur','mannsfellesskap'],['kjokken','Kjøkken',''],['torsdagsgruppa','Torsdagsgruppa',''],['vertskap','Vertskap',''],['lederradet','Lederrådet',''],['ungdomsledere','Ungdomsledere',''],['sommerstevne','Sommerstevne','']];
const GR_IDS=GROUPS.map(g=>g[0]);
const gName=id=>{const g=GROUPS.find(x=>x[0]===id);return g?g[1]:id};
const gLabel=id=>{const g=GROUPS.find(x=>x[0]===id);return g?g[1]+(g[2]?' ('+g[2]+')':''):id};
/* Innhold med grupper vises bare for administratorer og medlemmer i minst én av gruppene. Dette er en visning i appen; sikkerheten for «bare medlemmer» ligger i databasen. */
const canSee=x=>!(x.groups&&x.groups.length)||state.admin||(state.groups||[]).concat(state.leads||[]).some(g=>x.groups.includes(g));
/* Gruppeledere (leads på oppføringen i members) kan bare publisere til gruppene de leder. Det håndheves i databasen (firestore.rules) og i varselscriptet. */
const isLeader=()=>!state.admin&&(state.leads||[]).length>0;
const myGroupOptions=()=>state.admin?GR_IDS:(state.leads||[]);
const ledItem=x=>(x.groups||[]).length>0&&(x.groups||[]).every(g=>(state.leads||[]).includes(g));
const malTekst=m=>m.type==='grupper'?'gruppene '+m.groups.map(gName).join(', '):m.type==='medlem'?'medlemmer':'alle';
const postTags=p=>(p.groups&&p.groups.length?p.groups.map(gName):(p.audience&&p.audience.length?p.audience:[p.tag||'Alle'])).map(a=>`<span class="tag ${a==='Medlem'?'m':''}">${esc(a)}</span>`).join(' ');
const PLACES=['Kometvegen 7','Åndalsnes','Eidsvåg','Eide','Tingvoll'],TIMES=['11:00','12:00','19:00'];
/* [felt, etikett, type, valg, type på feltet for «Annet»]. Stjerne etter typen betyr obligatorisk. */
const FIELDS={
 events:[['title','Tittel','text*'],['start','Startdato','date*'],['end','Sluttdato (bare for flere dager)','date'],['time','Klokkeslett','combo',TIMES,'time'],['place','Sted','combo',PLACES,'text'],['who','Taler eller hvem','text'],['text','Beskrivelse','area'],['cat','Kategori','sel',CATS],['groups','Gruppe (valgfritt). Bare medlemmer i valgte grupper og administratorer ser arrangementet','multi',GR_IDS],['m','Bare for medlemmer','chk'],['hideHome','Ikke vis på Hjem (vises fortsatt i Program)','chk']],
 posts:[['t','Tittel','text*'],['b','Melding','area*'],['audience','Målgruppe','multi',['Alle','Medlem',...GR_IDS]],['hideHome','Ikke vis på Hjem (vises fortsatt i Nyheter)','chk'],['push','Send også som varsel til telefonene','chk']],
 regular:[['title','Tittel','text*'],['day','Ukedag','sel',[1,2,3,4,5,6,0]],['time','Klokkeslett','combo*',TIMES,'time'],['note','Merknad','text'],['cat','Kategori','sel',CATS]]};
const COL={events:'events',posts:'posts',regular:'regular'};
const TYPES=[['events','Arrangement'],['posts','Nyhet'],['regular','Fast samling']];
function fields(t,ed){return FIELDS[t].filter(f=>(f[0]!=='push'||(PUSH_URL&&!ed))&&(state.admin||f[0]!=='m')).map(([k,l,ty,o,it])=>{
  const req=ty.endsWith('*'),b=ty.replace('*',''),v=ed?ed[k]:undefined;
  if(b==='combo'){const known=!v||o.includes(v),cur=!ed?o[0]:!v?(req?o[0]:''):known?v:'__annet';
    return `<label class="f">${l}<select name="${k}Sel">${o.map(x=>`<option value="${x}" ${cur===x?'selected':''}>${x}</option>`).join('')}${req?'':`<option value="" ${cur===''?'selected':''}>Ikke oppgitt</option>`}<option value="__annet" ${cur==='__annet'?'selected':''}>Annet</option></select><input name="${k}" type="${it}" value="${known?'':esc(v)}" ${known?'hidden':''}></label>`}
  if(b==='multi'){
    const isAud=k==='audience';
    const cur=ed?(ed[k]&&ed[k].length?ed[k]:(isAud&&state.admin?[ed.tag||'Alle']:[])):(isAud&&state.admin?['Alle']:[]);
    const nm=x=>x==='Alle'?'Alle (åpen for alle)':x==='Medlem'?'Bare medlemmer (innloggede)':gLabel(x);
    const tips=!state.admin?'Velg minst én av gruppene du leder. Bare medlemmer i gruppene og administratorer ser innholdet.':isAud?'Velger du ingenting, blir nyheten åpen for alle. «Bare medlemmer» krever innlogging. Velger du grupper, er det bare medlemmer i de gruppene (og administratorer) som ser nyheten.':'Velger du ingen grupper, gjelder arrangementet alle.';
    return `<fieldset class="f" style="border:0;padding:0;margin:0"><legend style="font-weight:600;font-size:14px;margin-bottom:4px">${l}</legend>${(state.admin?o:myGroupOptions()).map(x=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="${k}" value="${x}" style="width:22px;height:22px;flex:none" ${cur.includes(x)?'checked':''}>${esc(nm(x))}</label>`).join('')}<span class="small">${tips}</span></fieldset>`}
  if(b==='area')return `<label class="f">${l}<textarea name="${k}" rows="3" ${req?'required':''}>${esc(v)}</textarea></label>`;
  if(b==='sel')return `<label class="f">${l}<select name="${k}">${o.map(x=>`<option value="${x}" ${String(v==null?o[0]:(k==='cat'?normCat(v):v))===String(x)?'selected':''}>${k==='day'?cap(DAYS[x]):x}</option>`).join('')}</select></label>`;
  if(b==='chk')return `<label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="${k}" style="width:auto" ${v?'checked':''}>${l}</label>`;
  return `<label class="f">${l}<input name="${k}" type="${b}" ${req?'required':''} value="${esc(v)}"></label>`}).join('')}
function admItems(t){const l=t==='events'?rawEvents.slice().sort((a,b)=>a.start<b.start?-1:1):t==='posts'?posts:regular;return state.admin?l:l.filter(ledItem)}
function admLabel(t,x){return t==='events'?`${esc(x.start)} · ${esc(x.title)}${x.groups&&x.groups.length?' <span class="small">('+esc(x.groups.map(gName).join(', '))+')</span>':''}${x.hideHome?' <span class="small">(skjult på Hjem)</span>':''}`:t==='posts'?esc(x.t)+(x.tag&&x.tag!=='Alle'?' <span class="small">('+esc(x.tag)+')</span>':'')+(x.hideHome?' <span class="small">(skjult på Hjem)</span>':''):`${cap(DAYS[x.day])} ${esc(x.time)} · ${esc(x.title)}`}
function admin(){
  const t=state.adm.type,items=admItems(t),ed=state.adm.edit?items.find(x=>x.id==state.adm.edit):null;
  const nSel=items.filter(x=>state.sel[x.id]).length;
  return `<details class="card acc" data-acc="adm" ${state.acc.adm?'open':''}><summary><h2>${state.admin?'Administrator':'Publiser for gruppene dine'}</h2></summary>
  ${usingFb||!state.admin?'':`<p class="small" style="margin:8px 0">Databasen er tom, og appen viser innholdet fra JSON-filene. Flytt det over først, ellers forsvinner det når du legger til noe nytt.</p><button class="btn" data-aimport>Flytt eksisterende innhold til databasen</button>`}
  <div class="chips" style="margin:12px 0">${TYPES.filter(([k])=>state.admin||k!=='regular').map(([k,l])=>`<button class="chip" data-at="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div>
  <form class="form" id="adm" data-type="${t}">${fields(t,ed)}
   <div class="btns"><button class="btn primary" type="submit" style="width:auto">${ed?'Lagre endring':'Legg til'}</button>${ed?'<button class="btn" type="button" data-acancel>Avbryt</button>':''}</div></form>
  <p class="small" role="status" style="margin:8px 0 0">${esc(state.msg)}</p></details>
  <details class="card acc" data-acc="eks" ${state.acc.eks?'open':''}><summary><h3>Eksisterende (${items.length})</h3></summary>
  ${items.length?`<div class="btns" style="align-items:center;margin:4px 0 8px"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" data-aselall style="width:22px;height:22px" ${nSel===items.length?'checked':''}>Velg alle</label>
  <button class="btn" data-adelsel ${nSel?'':'disabled'}>Slett valgte (${nSel})</button></div>`:''}
  <div class="reg">${items.map(x=>`<div class="r"><input type="checkbox" data-asel="${esc(x.id)}" aria-label="Velg" style="width:22px;height:22px;flex:none;align-self:center" ${state.sel[x.id]?'checked':''}><div class="grow">${admLabel(t,x)}</div><button class="btn" data-aedit="${esc(x.id)}">Rediger</button><button class="btn" data-adel="${esc(x.id)}">Slett</button></div>`).join('')||'<p class="small">Ingenting ennå.</p>'}</div></details>`}

const EYE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.7C3.7 8.5 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const pwField=(id,label,ac,extra)=>`<label class="f">${label}<span class="pw"><input id="${id}" type="password" autocomplete="${ac}" ${extra||''} required><button type="button" class="eye" data-eye aria-label="Vis passord" aria-pressed="false">${EYE}</button></span></label>`;

  const me=state.user?state.user.email:'';
  return `<details class="card acc" data-acc="brukere" ${state.acc.brukere?'open':''}><summary><h3>Brukere (${members.length})</h3></summary>
  <p class="small" style="margin:0 0 10px">Skriv inn e-postadressen og velg rolle. Personen får en e-post og velger passord selv.</p>
  <form class="form" id="mem"><label class="f">E-post<input id="mE" type="email" required value="${esc(state.memE)}"></label>
  <label class="f">Rolle<select id="mR"><option value="member" ${state.memR==='member'?'selected':''}>Medlem</option><option value="admin" ${state.memR==='admin'?'selected':''}>Administrator (kan endre innhold og brukere)</option></select></label>

   return `<div class="r" style="flex-wrap:wrap"><div class="grow" style="min-width:60%">${esc(x.id)}${self?' (deg)':''}<br><span class="tag ${adm?'':'m'}">${adm?'Administrator':'Medlem'}</span>${(x.leads||[]).length?' <span class="tag">Gruppeleder</span>':''}</div>
   <details ${state.ugOpen===x.id?'open':''} style="flex-basis:100%"><summary class="small" style="cursor:pointer">Grupper (${(x.groups||[]).length})${(x.groups||[]).length?': '+esc((x.groups||[]).map(gName).join(', ')):''}</summary><div style="display:grid;gap:6px;margin:6px 0">${GROUPS.map(g=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px"><input type="checkbox" data-ug="${esc(x.id)}" data-gid="${g[0]}" style="width:22px;height:22px;flex:none" ${(x.groups||[]).includes(g[0])?'checked':''}>${esc(gLabel(g[0]))}</label>`).join('')}</div></details>
   ${adm?'':`<details ${state.ulOpen===x.id?'open':''} style="flex-basis:100%"><summary class="small" style="cursor:pointer">Leder for (${(x.leads||[]).length})${(x.leads||[]).length?': '+esc((x.leads||[]).map(gName).join(', ')):''}</summary><div class="small" style="margin:4px 0">Kan publisere nyheter, arrangementer og varsler, men bare til gruppene som er avkrysset. Personen legges også inn i gruppen.</div><div style="display:grid;gap:6px;margin:6px 0">${GROUPS.map(g=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px"><input type="checkbox" data-ul="${esc(x.id)}" data-gid="${g[0]}" style="width:22px;height:22px;flex:none" ${(x.leads||[]).includes(g[0])?'checked':''}>${esc(gLabel(g[0]))}</label>`).join('')}</div></details>`}
   <div class="btns"><button class="btn" data-memreset="${esc(x.id)}">Nytt passord</button>${self?'':`<button class="btn" data-memrole="${esc(x.id)}" data-to="${adm?'member':'admin'}">${adm?'Gjør til medlem':'Gjør til admin'}</button><button class="btn" data-memdel="${esc(x.id)}">Fjern</button>`}</div></div>`}).join('')||'<p class="small">Ingen brukere lagt inn ennå.</p>'}</div></details>`}

function pushCard(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  const on=!!lsGet('sm-push');
  const body=ios&&!standalone?'På iPhone må du først legge appen på hjemskjermen (Del → Legg til på Hjem-skjerm), og så slå på varsler derfra.'
    :!FB||!state.pushOk?'Varsler støttes ikke i denne nettleseren.'
    :on?'<button class="btn" data-pushoff>Slå av varsler</button> <button class="btn" data-pushcopy>Kopier varselkode</button>':'<button class="btn primary" data-pushon style="width:auto">Slå på varsler</button>';
  return `<details class="card acc" data-acc="varsler" ${state.acc.varsler?'open':''}><summary><h2>Varsler</h2></summary><p class="small" style="margin:0 0 12px">Få beskjed om nyheter og endringer, også når appen er lukket.</p>${body}<p class="small" role="status" style="margin:8px 0 0">${esc(state.pushMsg)}</p></details>`}

  <div id="psGrBox" ${!state.admin||state.psMal==='grupper'?'':'hidden'} style="display:grid;gap:6px">${GROUPS.filter(g=>state.admin||(state.leads||[]).includes(g[0])).map(g=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px"><input type="checkbox" data-psgr="${g[0]}" style="width:22px;height:22px;flex:none" ${state.psGr.includes(g[0])?'checked':''}>${esc(gLabel(g[0]))}</label>`).join('')}</div>

function loginCard(){
  if(state.user)return `<div class="card"><div class="row"><div class="grow"><b>${state.admin?'Innlogget som administrator':isLeader()?'Innlogget som gruppeleder':state.member?'Innlogget som medlem':'Innlogget, men ikke på medlemslisten'}</b><div class="small">${esc(state.user.email)}</div></div>
   <button class="btn" data-logout>Logg ut</button></div>

    state.groups=u&&state.member?await FB.myGroups(u.email):[];
    state.leads=u&&state.member&&!state.admin?await FB.myLeads(u.email):[];
    if(u&&lsGet('sm-push'))FB.linkPush(lsGet('sm-push')).catch(()=>{});
    await load();
    if(first){first=false;if(state.tab==='news')markSeen();render()}else keep(()=>{});
  };
  if(FB)FB.onAuth(u=>go(u).catch(()=>{$('#view').textContent='Kunne ikke laste program. Prøv igjen senere.'}));
  else{await load();render()}
}
start().catch(()=>{$('#view').textContent='Kunne ikke laste program. Prøv igjen senere.'});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};if(d.type==='open-tab'&&['home','prog','news','me'].includes(d.tab)){state.tab=d.tab;if(d.tab==='news')markSeen();render()}})}
</script>
</body></html>
